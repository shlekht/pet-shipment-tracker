[project]
name = "shipment-tracking-api"
version = "0.1.0"
description = "Practice FastAPI project"
readme = "README.md"
authors = [
    { name = "Nikita", email = "322liquid@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "flower>=2.1.0",
    "gunicorn>=26.2.0",
    "kombu>=5.6.2",
    "python-jose>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
]



[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.fastapi]
entrypoint = "src.shipment_tracking_api.main:app"
